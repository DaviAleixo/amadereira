<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>Amadeireira</title>
    <meta name="description" content="Mesas de madeira maciça de grande porte, mesa cascata, mesa prancha e mesa raiz sob medida. Peças únicas e exclusivas com acabamento de alto padrão." />
    <link rel="canonical" href="https://amadeireira.com.br" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amadeireira.com.br" />
    <meta property="og:title" content="Amadeireira — Móveis Autorais de Madeira Maciça" />
    <meta property="og:description" content="Mesa cascata, mesa prancha, mesa raiz e peças exclusivas sob medida. Transformamos a madeira doada pela natureza em arte para seus ambientes." />
    <meta property="og:image" content="/images/hero-bg-desktop.png" />
    <meta property="og:site_name" content="Amadeireira" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amadeireira — Móveis Autorais de Madeira Maciça" />
    <meta name="twitter:description" content="Mesas de grande porte, mesa cascata, mesa prancha e peças sob medida." />
    <meta name="twitter:image" content="/images/hero-bg-desktop.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    <link rel="apple-touch-icon" href="/images/logo.webp" />

    <!-- Google Fonts: Alfa Slab One + Bebas Neue + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FurnitureStore",
        "name": "Amadeireira",
        "image": "https://amadeireira.com.br/images/hero-bg-desktop.png",
        "description": "Ateliê especializado em móveis autorais de madeira maciça, mesas cascata, mesas prancha e mesas raiz de alto padrão.",
        "telephone": "+55-19-98415-3232",
        "url": "https://amadeireira.com.br",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Campinas",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "priceRange": "$$$$"
      }
    </script>
  </head>
  <body class="bg-[#141414] text-[#f3e2ba] antialiased selection:bg-[#be7b4c] selection:text-[#141414]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
